name: fdu-course
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fdu_course
      POSTGRES_USER: fdu_course
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U fdu_course -d fdu_course']
      interval: 5s
      timeout: 5s
      retries: 12
  app:
    build:
      context: .
      target: app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://fdu_course:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/fdu_course
      PUBLIC_ORIGIN: https://${SITE_DOMAIN:?Set SITE_DOMAIN}
      IDENTITY_SECRET: ${IDENTITY_SECRET:?Set IDENTITY_SECRET}
      CONNECTOR_SECRET: ${CONNECTOR_SECRET:?Set CONNECTOR_SECRET}
      CONNECTOR_URL: http://connector:3002
      ADMIN_UIS_IDS: ${ADMIN_UIS_IDS:-}
      CURRENT_TERM: ${CURRENT_TERM:-2026-2027学年 第一学期}
      UIS_ENABLED: ${UIS_ENABLED:-false}
      DEMO_MODE: 'false'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
  connector:
    build:
      context: .
      target: connector
    restart: unless-stopped
    init: true
    shm_size: 256mb
    mem_limit: 2g
    environment:
      CONNECTOR_SECRET: ${CONNECTOR_SECRET:?Set CONNECTOR_SECRET}
      CONNECTOR_CONCURRENCY: '2'
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3002/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
  web:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGDATABASE: fdu_course
      PGUSER: fdu_course
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
      - ./scripts/backup-loop.sh:/backup-loop.sh:ro
    entrypoint: [sh, /backup-loop.sh]
    depends_on:
      db:
        condition: service_healthy
volumes:
  database:
  caddy_data:
  caddy_config:
